<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .apt-widget-icon {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-transition: all 0.3s ease-out;
        -moz-transition: all 0.3s ease-out;
        -ms-transition: all 0.3s ease-out;
        -o-transition: all 0.3s ease-out;
        transition: all 0.3s ease-out;
        -webkit-transform: rotate(-60deg);
        -moz-transform: rotate(-60deg);
        -ms-transform: rotate(-60deg);
        -o-transform: rotate(-60deg);
        transform: rotate(-60deg);
        opacity: 0;
        visibility: hidden;
        position: absolute;
        top: 0;
        left: 0;
      }
      .icon-wrapper > div,
      .icon-wrapper svg,
      .icon-wrapper img {
        display: flex;
      }
      .apt-widget-icon.active {
        opacity: 1;
        visibility: visible;
        -webkit-transform: rotate(0deg);
        -moz-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        -o-transform: rotate(0deg);
        transform: rotate(0deg);
      }
      .apt-icon-fix {
        position: relative;
        top: 2px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      body {
        margin: 0;
        overflow: hidden;
        width: 58px;
        height: 58px;
        background: #f37021;
        border-radius: 50%;
        cursor: pointer;
      }
      .icon-wrapper {
        position: relative;
        width: 58px;
        height: 58px;
      }
      .apt-icon-bulb img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        /* source art is black on transparent; show white on orange */
        filter: invert(1);
      }
      .apt-icon-close svg {
        width: 36px;
        height: 36px;
      }
    </style>
  </head>
  <body>
    <div class="icon-wrapper" id="handle" title="Knowledge Center">
      <div class="apt-widget-icon apt-icon-bulb active" id="bulb">
        <div class="apt-icon-fix">
          <img
            src="/practice-fusion-lightbulb.png"
            alt=""
            width="40"
            height="40"
          />
        </div>
      </div>
      <div class="apt-widget-icon apt-icon-close" id="close">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 5L19 19M19 5L5 19"
            stroke="#fff"
            stroke-width="1.75"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>
    <script>
      (function () {
        var open = false;
        var bulb = document.getElementById("bulb");
        var close = document.getElementById("close");
        var handle = document.getElementById("handle");

        function render() {
          if (open) {
            bulb.classList.remove("active");
            close.classList.add("active");
          } else {
            close.classList.remove("active");
            bulb.classList.add("active");
          }
        }

        handle.addEventListener("click", function () {
          open = !open;
          render();
          parent.postMessage({ type: "apt-widget-toggle", open: open }, "*");
        });

        window.addEventListener("message", function (event) {
          if (!event.data || event.data.type !== "apt-widget-state") return;
          open = !!event.data.open;
          render();
        });
      })();
    </script>
  </body>
</html>
